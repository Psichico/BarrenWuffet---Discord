services:
  - type: worker
    name: news-bot
    runtime: python            # or "docker" if using the Dockerfile
    plan: starter              # smallest paid worker; free tier does not keep workers alive 24/7
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m src.main"
    autoDeploy: true
    disk:
      name: news-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FINVIZ_AUTH_TOKEN
        sync: false            # set in dashboard, never in git
      - key: DISCORD_NEWS_WEBHOOK_URL
        sync: false
      - key: DISCORD_STOCKS_WEBHOOK_URL
        sync: false
      - key: DISCORD_INSIDERS_WEBHOOK_URL
        sync: false
      - key: DISCORD_URGENT_WEBHOOK_URL
        sync: false            # v1.1 — optional until you add the urgent channel
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEDUPE_PATH
        value: /var/data/seen.db

  - type: worker
    name: junior-researcher-bot
    runtime: python
    # GITHUB_TOKEN must be a PAT with read access to the private stockdb repo.
    # Rewriting the URL via git config (not inline in requirements.txt) is what
    # lets the shell expand ${GITHUB_TOKEN} — pip does not expand env vars in
    # requirements file contents.
    buildCommand: "git config --global url.\"https://${GITHUB_TOKEN}@github.com/\".insteadOf \"https://github.com/\" && pip install -r requirements.txt -r scripts/JuniorResearcher/requirements.txt && playwright install chromium"
    startCommand: "python scripts/JuniorResearcher/researcher_bot.py"
    autoDeploy: true
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: GITHUB_TOKEN
        sync: false            # set in dashboard — PAT with read access to HirkshireBathaway---Database
