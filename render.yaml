services:
  - type: worker
    name: news-bot
    runtime: docker
    plan: starter              # smallest paid worker; free tier does not keep workers alive 24/7
    startCommand: "python -m src.main"
    autoDeploy: true
    disk:
      name: news-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FINVIZ_AUTH_TOKEN
        sync: false            # set in dashboard, never in git
      - key: DISCORD_NEWS_WEBHOOK_URL
        sync: false
      - key: DISCORD_STOCKS_WEBHOOK_URL
        sync: false
      - key: DISCORD_INSIDERS_WEBHOOK_URL
        sync: false
      - key: DISCORD_URGENT_WEBHOOK_URL
        sync: false            # v1.1 — optional until you add the urgent channel
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEDUPE_PATH
        value: /var/data/seen.db

  - type: worker
    name: reddit-bot
    runtime: docker
    plan: starter
    startCommand: "python -m scripts.reddit.reddit_bot"
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: REDDIT_DISCORD_CHANNEL_ID
        sync: false
      - key: REDDIT_PROXY
        sync: false            # Optional: your residential proxy user:pass@ip:port
      - key: REDDIT_HEADLESS
        value: "true"
