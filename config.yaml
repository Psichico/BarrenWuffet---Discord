poll_interval_seconds: 300           # 5 minutes on weekdays
poll_interval_weekend_seconds: 10800 # 3 hours on weekends

# On first boot with an empty dedupe store, mark current items seen WITHOUT
# alerting, so a restart never dumps the backlog to Discord (see §8).
warm_start: true

llm:
  model: claude-sonnet-5
  max_tokens: 1024
  batch_size: 20                     # items per Claude call
  rewrite: true                      # true = Claude rewrites kept items to your style
  # The interest profile is the heart of the filter. Plain English.
  interest_profile: |
    KEEP news about:
      - AI chip / datacenter / HBM demand, capex, supply
      - Earnings results, guidance changes, major product launches in tech and semiconductors
      - M&A, partnerships, and major customer wins in tech and semiconductors
      - Export controls / geopolitics affecting technology supply chains
      - General AI developments, software models, and AI cloud infrastructure spending (e.g., OpenAI, Meta, Microsoft, Tesla, Google, Apple)
      - Major macroeconomic updates and market-moving events (e.g., Federal Reserve decisions, CPI/inflation, jobs/employment reports)
    DROP:
      - Minor or routine economic data (only keep major market-moving macro)
      - Duplicate coverage of a story already reported
  # Urgency guidance — the filter tags every KEPT item high/medium/low.
  urgency_guidance: |
    high   = market-moving RIGHT NOW: earnings surprise, guidance cut/raise,
             M&A announcement, major contract win/loss, halt, export ban.
    medium = notable but not a same-minute trade trigger: product launch,
             analyst day, partnership, sector-wide development.
    low    = context / background worth reading but not acting on immediately.
  rewrite_style: |
    Rewrite each kept headline as ONE punchy sentence a busy trader can scan.
    Lead with the ticker. State the fact, not hype. No emoji.

sources:
  # Finviz Portfolio PID: 1001063054
  finviz_market:
    type: finviz_news
    v: "1"
    watchlist: []
    mode: news_export        # news_export | html_fallback
    max_items_per_fetch: 50
  finviz_stocks:
    type: finviz_news
    v: "3"
    pid: "1001063054"        # only honored when WATCHLIST_ONLY=1 (env var, see render.yaml)
    watchlist: []
    mode: news_export        # news_export | html_fallback
    max_items_per_fetch: 50
  finviz_insiders:
    type: finviz_insiders
    pid: "1001063054"
    min_value: 1000000

sinks:
  discord_news:
    type: discord
    webhook_env_var: DISCORD_NEWS_WEBHOOK_URL
    min_urgency: low                 # gets everything kept from market news
    min_urgency_env_var: DISCORD_NEWS_MIN_URGENCY   # overrides min_urgency from Render dashboard
    allowed_sources: ["finviz_market"]
    # username: "Anuradha_1ka2_"
    # avatar_url: "https://canvas-lb.tubitv.com/opts/-gL39FOGnXmsXQ==/88c87902-0d6d-40ef-93b4-93be17d6d770/CJ4GEMADOgUxLjEuOQ=="  # optional: link to a custom image URL
    rate_limit_sleep: 1.0
  discord_stocks:
    type: discord
    webhook_env_var: DISCORD_STOCKS_WEBHOOK_URL
    min_urgency: low                 # gets everything kept from stocks news
    min_urgency_env_var: DISCORD_STOCKS_MIN_URGENCY # overrides min_urgency from Render dashboard
    allowed_sources: ["finviz_stocks"]
    # username: "Stock Alerts"
    rate_limit_sleep: 1.0
  discord_insiders:
    type: discord
    webhook_env_var: DISCORD_INSIDERS_WEBHOOK_URL
    min_urgency: high
    min_urgency_env_var: DISCORD_INSIDERS_MIN_URGENCY # overrides min_urgency from Render dashboard
    allowed_sources: ["finviz_insiders"]
    rate_limit_sleep: 1.0

dedupe:
  prune_older_than_days: 120
  path: ./seen.db                    # local dev; Render overrides via DEDUPE_PATH

# ── cadbury_bot ── end-of-day Market Recap email. Self-contained optional feature.
#    To remove: delete scripts/cadbury_bot/, revert the 2 hook lines in
#    src/orchestrator.py and the ~4 lines in src/main.py, and delete this block.
#    See scripts/cadbury_bot/README.md for the full checklist.
cadbury_bot:
  enabled: true
  timezone: America/New_York
  send_hour: 16                      # 24h ET wall clock
  send_minute: 30                    # 16:30 ET = regular close + 30 min
  model: claude-sonnet-5
  max_tokens: 2000
  max_items: 12                      # merge related headlines beyond this
  recipients:
    - j.patel.4779@westcliff.edu
  subject_prefix: "Market Recap"     # -> "Market Recap — Wed, Aug 26 2026"
  smtp_host: smtp.gmail.com
  smtp_port: 587
  sender_env_var: GMAIL_ADDRESS      # secrets stay in env, only the NAMES here
  password_env_var: GMAIL_APP_PASSWORD
  recap_intro: |
    You are writing an end-of-day market recap email for one trader. The input is
    the list of headlines this bot flagged as important today, already filtered to
    the trader's interests (AI chips / datacenter / HBM, tech & semi earnings and
    guidance, M&A, export controls, major AI developments, market-moving macro)
    and given to you IN THE ORDER THEY CROSSED during the day. Write only from the
    one-liners provided — never add figures, quotes, or facts not in the input.
  recap_style: |
    Plain text only. No markdown headers, no bullets, no JSON. Structure exactly:
      - Line 1: ONE punchy ALL-CAPS sentence you write fresh for today, tone
        matching how eventful the day was (chaotic vs a grind vs dead quiet).
      - Line 2: "Here's the recap, in the order it crossed today:"
      - Then a numbered list (1., 2., 3., ...) KEEPING THE INPUT ORDER — do not
        re-rank. 1-3 sentences per item. Lead with the company name then $TICKER.
        State the fact, no hype, no emoji.
      - If more than {max_items} items were given, merge closely related headlines
        into a single number so the list is {max_items} or fewer.
      - If no items were given, replace the list with exactly:
        "Nothing crossed the bot's filter today — markets were quiet on the names
        you follow."
      - Last line: ONE fresh ALL-CAPS sign-off sentence.
